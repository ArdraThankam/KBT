{% extends "base.html" %}
{% block title %}{{ title }} · {{ site.title }}{% endblock %}
{% block content %}
<div class="nk-content nk-content-fluid">
    <div class="container-xl wide-lg">
        <div class="nk-content-body">
            <div class="nk-block-head nk-block-head-sm">
                <h3 class="nk-block-title page-title">{{ title }}</h3>
                <div class="nk-block-des text-soft"><p>{{ message }}</p></div>
            </div>
            {% if detail %}<div class="nk-block"><div class="card card-bordered"><div class="card-inner"><code>{{ detail }}</code></div></div></div>{% endif %}
            <a href="/" class="btn btn-outline-light"><span>Back to the overview</span></a>
        </div>
    </div>
</div>
{% endblock %}
