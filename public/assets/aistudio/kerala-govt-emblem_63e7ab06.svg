<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g fill="none" stroke="#fbbf24" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)">
    <!-- Ashoka Lion Capital at Top Center -->
    <g transform="translate(150, 24) scale(0.65)">
      <!-- Abacus Base -->
      <rect x="-20" y="16" width="40" height="6" rx="1" fill="#fbbf24"/>
      <!-- Lions representation -->
      <path d="M-14 16 C-16 6 -8 0 0 -2 C8 0 16 6 14 16 Z" fill="#fbbf24"/>
      <circle cx="0" cy="8" r="4" fill="#0d3b66" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M-8 16 L-8 12 M8 16 L8 12 M0 16 L0 12" stroke="#0d3b66" stroke-width="1"/>
    </g>

    <!-- Satyameva Jayate Banner -->
    <text x="150" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#fbbf24" stroke="none">സത്യമേവ ജയതേ</text>

    <!-- Central Shankha (Conch Shell) with Wreath -->
    <g transform="translate(150, 78)">
      <!-- Outer Oval Laurel Wreath -->
      <ellipse cx="0" cy="0" rx="20" ry="24" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/>
      <!-- Inner Conch Shell (Shankha) -->
      <path d="M-6 -12 C-2 -18 8 -16 10 -8 C12 2 4 14 0 18 C-4 14 -12 2 -10 -8 C-8 -16 2 -18 -6 -12 Z" fill="#fbbf24"/>
      <path d="M-2 -8 C4 -8 6 -2 2 6 C0 10 -4 6 -2 -8 Z" fill="#0d3b66"/>
      <circle cx="0" cy="-6" r="2.5" fill="#fbbf24"/>
    </g>

    <!-- Left Elephant -->
    <g transform="translate(70, 70) scale(1.15)">
      <!-- Body & Head -->
      <path d="M 35,45 C 30,25 20,15 0,10 C -15,8 -25,18 -25,32 C -25,48 -15,55 -5,55 C 5,55 10,48 10,40 C 10,32 5,28 0,28 C -5,28 -8,32 -8,36" stroke-width="2.5"/>
      <!-- Elephant Raised Trunk extending to top -->
      <path d="M 0,10 C 10,0 25,-15 35,-25 C 38,-28 42,-25 38,-20 C 30,-10 18,2 8,14" stroke-width="2.2" fill="none"/>
      <!-- Tusks -->
      <path d="M 8,22 C 16,22 22,18 25,14" stroke-width="2"/>
      <!-- Ears & Details -->
      <path d="M -10,14 C -18,18 -18,30 -10,36 C -5,32 -5,20 -10,14" stroke-width="1.8"/>
      <!-- Legs -->
      <path d="M -20,35 L -22,58 M -12,40 L -12,58 M 12,45 L 12,58 M 22,45 L 22,58" stroke-width="3"/>
      <!-- Back contour -->
      <path d="M -25,32 C -30,22 -15,10 0,10" stroke-width="2.5"/>
    </g>

    <!-- Right Elephant (Mirrored) -->
    <g transform="translate(230, 70) scale(-1.15, 1.15)">
      <!-- Body & Head -->
      <path d="M 35,45 C 30,25 20,15 0,10 C -15,8 -25,18 -25,32 C -25,48 -15,55 -5,55 C 5,55 10,48 10,40 C 10,32 5,28 0,28 C -5,28 -8,32 -8,36" stroke-width="2.5"/>
      <!-- Elephant Raised Trunk extending to top -->
      <path d="M 0,10 C 10,0 25,-15 35,-25 C 38,-28 42,-25 38,-20 C 30,-10 18,2 8,14" stroke-width="2.2" fill="none"/>
      <!-- Tusks -->
      <path d="M 8,22 C 16,22 22,18 25,14" stroke-width="2"/>
      <!-- Ears & Details -->
      <path d="M -10,14 C -18,18 -18,30 -10,36 C -5,32 -5,20 -10,14" stroke-width="1.8"/>
      <!-- Legs -->
      <path d="M -20,35 L -22,58 M -12,40 L -12,58 M 12,45 L 12,58 M 22,45 L 22,58" stroke-width="3"/>
      <!-- Back contour -->
      <path d="M -25,32 C -30,22 -15,10 0,10" stroke-width="2.5"/>
    </g>

    <!-- Base Scroll Ribbon -->
    <g transform="translate(150, 155)">
      <!-- Decorative Ribbon Scroll -->
      <path d="M -110,-10 C -70,-20 70,-20 110,-10 C 120,-5 120,15 100,18 C 60,24 -60,24 -100,18 C -120,15 -120,-5 -110,-10 Z" fill="#0d3b66" stroke="#fbbf24" stroke-width="2"/>
      <!-- Ribbon Ends -->
      <path d="M -110,-10 L -130,-2 M -100,18 L -125,24 M 110,-10 L 130,-2 M 100,18 L 125,24" stroke="#fbbf24" stroke-width="1.8"/>
      
      <!-- Malayalam Inscription -->
      <text x="0" y="-1" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#fbbf24" stroke="none">കേരള സർക്കാർ</text>
      <!-- English Inscription -->
      <text x="0" y="11" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#fbbf24" stroke="none">GOVERNMENT OF KERALA</text>
    </g>
  </g>
</svg>
